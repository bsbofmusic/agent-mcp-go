name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Verify main CI approved this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          gh run list --repo "$RELEASE_REPO" --workflow ci.yml --branch main --commit "$(git rev-parse HEAD)" --status completed --json conclusion --jq 'any(.[]; .conclusion == "success")' | python3 -c 'import sys; assert sys.stdin.read().strip() == "true", "main CI must pass for this exact SHA before tagging"'
      - run: go vet ./...
      - run: go test -count=1 -timeout=4m ./...
      - name: Package validated platform and dependency licenses
        run: python3 scripts/package-release.py "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" --verify-tag --title "AMG $GITHUB_REF_NAME — Remote Agent Workspace over MCP" --notes-file "docs/releases/$GITHUB_REF_NAME.md" dist/*.tar.gz dist/checksums.txt
