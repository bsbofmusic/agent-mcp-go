    <g>
      <rect x="672" y="348" width="288" height="88" rx="13" fill="#faf6ff" stroke="#e0d1f2"/>
      <g transform="translate(695 367)" stroke="#7946b3" stroke-width="2" fill="none" stroke-linecap="round">
