<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="464" viewBox="0 0 1000 464" role="img" aria-labelledby="title desc">
  <title id="title">AMG: one MCP endpoint, multiple agents</title>
  <desc id="desc">Web and desktop agents connect to AMG over authenticated MCP. AMG provides remote files, shell, Git and transfers, and can consume optional shared Skills, MCP and memory.</desc>
