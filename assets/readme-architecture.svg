  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="500" y="34" font-size="13" font-weight="700" letter-spacing="2" fill="#526278">WEB &amp; DESKTOP AGENTS</text>
    <!-- Client tiles use names and neutral initials, not embedded brand logos. -->
    <g>
      <rect x="40" y="51" width="168" height="80" rx="12" fill="#f8fafc" stroke="#dce4ee"/>
      <rect x="108" y="59" width="32" height="32" rx="9" fill="#e2f5ed"/>
      <text x="124" y="81" font-size="18" font-weight="700" fill="#166e56">C</text>
      <text x="124" y="114" font-size="16" font-weight="600" fill="#172536">ChatGPT</text>
    </g>
    <g>
      <rect x="228" y="51" width="168" height="80" rx="12" fill="#f8fafc" stroke="#dce4ee"/>
      <rect x="296" y="59" width="32" height="32" rx="9" fill="#e8efff"/>
      <text x="312" y="81" font-size="18" font-weight="700" fill="#365cce">G</text>
      <text x="312" y="114" font-size="16" font-weight="600" fill="#172536">Gemini</text>
    </g>
    <g>
      <rect x="416" y="51" width="168" height="80" rx="12" fill="#f8fafc" stroke="#dce4ee"/>
      <rect x="484" y="59" width="32" height="32" rx="9" fill="#fae9dd"/>
      <text x="500" y="81" font-size="18" font-weight="700" fill="#a75232">C</text>
      <text x="500" y="114" font-size="16" font-weight="600" fill="#172536">Claude</text>
    </g>
    <g>
      <rect x="604" y="51" width="168" height="80" rx="12" fill="#f8fafc" stroke="#dce4ee"/>
      <rect x="672" y="59" width="32" height="32" rx="9" fill="#eeebff"/>
      <text x="688" y="81" font-size="18" font-weight="700" fill="#6448cc">D</text>
      <text x="688" y="114" font-size="16" font-weight="600" fill="#172536">Doubao</text>
    </g>
    <g>
      <rect x="792" y="51" width="168" height="80" rx="12" fill="#f8fafc" stroke="#dce4ee"/>
      <rect x="860" y="59" width="32" height="32" rx="9" fill="#e2f4e7"/>
      <text x="876" y="81" font-size="18" font-weight="700" fill="#287347">Q</text>
      <text x="876" y="114" font-size="16" font-weight="600" fill="#172536">Qoder</text>
    </g>
    <g fill="none" stroke="#9aa9bb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M124 131V146H876V131 M312 131V146 M500 131V146 M688 131V146 M500 146V178"/>
      <path d="M495 172l5 6 5-6"/>
    </g>
    <rect x="570" y="150" width="305" height="22" rx="6" fill="#fff"/>
    <text x="722" y="165" font-size="12" fill="#526278">Streamable HTTP · Bearer / OAuth</text>
    <rect x="40" y="182" width="920" height="116" rx="15" fill="#142a43"/>
    <text x="500" y="217" font-size="28" font-weight="700" fill="#ffffff">AMG · Agent MCP Go</text>
    <text x="500" y="242" font-size="14" fill="#c7d9ec">Official Go MCP SDK · Remote Linux workspace</text>
    <text x="500" y="275" font-size="17" font-weight="600" fill="#ffffff">Files · Shell · Git · Transfers · Task handover</text>
    <g fill="none" stroke="#9aa9bb" stroke-width="1.6" stroke-linecap="round">
