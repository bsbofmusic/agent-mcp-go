      <text x="826" y="377" font-size="18" font-weight="700" fill="#172536">Shared Memory</text>
      <text x="826" y="402" font-size="15" fill="#7946b3">MemOS</text>
      <text x="826" y="420" font-size="11" fill="#526278">Recall across sessions</text>
    </g>
    <text x="500" y="452" font-size="11" fill="#526278">AMG runs independently · Shared modules are not bundled</text>
  </g>
