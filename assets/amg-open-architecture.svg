<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="488" viewBox="0 0 1000 488" role="img" aria-labelledby="title desc">
  <title id="title">AMG: your agent, your workspace, your ecosystem</title>
  <desc id="desc">Compatible web, desktop and CLI agents use authenticated MCP to access an independent remote execution core. Optional extension contracts let users choose their own providers. Skills Manager, AgentGateway and MemOS are recommended examples only.</desc>
